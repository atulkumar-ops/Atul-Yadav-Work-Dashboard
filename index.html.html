<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atul Yadav Work — Order Reconciliation Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;
    --panel:rgba(255,255,255,0.035);
    --panel-raised:rgba(0,255,102,0.05);
    --line:rgba(0,255,102,0.16);
    --amber:#00FF66;
    --amber-dim:rgba(0,255,102,0.4);
    --teal:#00E5FF;
    --text:#F2FBF6;
    --text-dim:#93A69D;
    --text-faint:#576259;
    --red:#E0665A;
    --green:#00FF66;
    --purple:#7C3AED;
    --mono: 'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'Space Grotesk',-apple-system,'Segoe UI',sans-serif;
    --display: 'Orbitron', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(0,255,102,0.08), transparent),
      radial-gradient(circle 700px at 100% 100%, rgba(124,58,237,0.10), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,255,102,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,102,0.045) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 85% 65% at 50% 0%, black 5%, transparent 70%);
  }
  body::after{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    box-shadow:inset 0 0 200px 50px rgba(0,0,0,0.9);
  }
  canvas#matrix{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.13;
  }
  .bg-glow-1{
    position:fixed; top:-25%; left:50%; transform:translateX(-50%);
    width:1300px; height:900px; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,255,102,0.10), transparent 60%);
  }
  .bg-glow-2{
    position:fixed; bottom:-15%; right:-12%; width:800px; height:800px; z-index:0; pointer-events:none;
    background:radial-gradient(circle, rgba(124,58,237,0.12), transparent 65%);
  }
  .particles{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .particle{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 8px 2px rgba(0,255,102,0.35);
    opacity:0.5; animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.55;}
    90%{opacity:0.35;}
    100%{transform:translateY(-100vh) translateX(20px); opacity:0;}
  }
  @keyframes pulseGlow{0%,100%{opacity:1;} 50%{opacity:0.4;}}
  .brand .mark{position:relative; animation:spinMark 6s linear infinite;}
  @keyframes spinMark{from{filter:hue-rotate(0deg);} to{filter:hue-rotate(20deg);}}
  .clock::before{
    content:''; display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 8px var(--amber); margin-right:6px;
    animation:pulseGlow 1.6s infinite;
  }
  header.top, nav.tabbar, main{position:relative; z-index:1;}
  ::selection{background:rgba(0,255,102,0.3);}

  header.top{
    padding:24px 32px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    backdrop-filter:blur(16px) saturate(140%);
    background:rgba(5,5,5,0.5);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:36px;height:36px;border-radius:9px;
    background:conic-gradient(from 180deg, var(--amber), var(--teal), var(--purple), var(--amber));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display); font-weight:900; color:#050505; font-size:14px;
    box-shadow:0 0 0 1px rgba(0,255,102,0.3), 0 4px 20px rgba(0,255,102,0.25);
  }
  .brand h1{
    font-size:16px; margin:0; letter-spacing:1px; font-weight:700;
    font-family:var(--display); text-transform:uppercase; color:var(--text);
  }
  .brand .sub{font-size:11.5px; color:var(--text-dim); font-family:var(--mono); margin-top:3px; letter-spacing:0.3px;}
  .clock{font-family:var(--mono); font-size:11.5px; color:var(--text-faint); text-align:right;}
  .clock b{color:var(--amber); font-weight:500;}

  nav.tabbar{
    display:flex;
    gap:2px;
    padding:0 32px;
    border-bottom:1px solid var(--line);
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(12px);
    overflow-x:auto;
  }
  .tabbtn{
    appearance:none; border:none; background:none; cursor:pointer;
    padding:14px 20px 12px;
    color:var(--text-dim);
    font-family:var(--sans); font-size:13.5px; font-weight:600;
    border-bottom:2px solid transparent;
    display:flex; align-items:center; gap:9px;
    white-space:nowrap;
    transition:color .15s;
  }
  .tabbtn .chip{width:8px;height:8px;border-radius:2px; background:var(--text-faint);}
  .tabbtn.active{color:var(--text); border-bottom-color:var(--amber); text-shadow:0 0 12px rgba(0,255,102,0.5);}
  .tabbtn.active .chip{background:var(--amber); box-shadow:0 0 8px var(--amber);}
  .tabbtn:hover{color:var(--text);}

  main{padding:28px 32px 80px; max-width:1200px; margin:0 auto;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .stepgrid{display:grid; grid-template-columns:1fr; gap:20px;}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 20px 50px rgba(0,0,0,0.5);
    transition:border-color .25s, box-shadow .25s;
  }
  .card:hover{border-color:rgba(0,255,102,0.35); box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px rgba(0,255,102,0.08);}
  .card .stepnum{
    font-family:var(--mono); font-size:11px; color:var(--amber);
    letter-spacing:1.5px; text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; gap:8px; margin-bottom:6px;
    text-shadow:0 0 10px rgba(0,255,102,0.35);
  }
  .card .stepnum .dot{width:5px;height:5px;border-radius:50%;background:var(--amber); box-shadow:0 0 8px var(--amber);}
  .card h2{font-size:16px; margin:0 0 4px; font-weight:700; font-family:var(--display); letter-spacing:0.3px; text-transform:uppercase;}
  .card p.hint{color:var(--text-dim); font-size:13px; margin:0 0 16px; line-height:1.5;}

  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    position:relative;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--amber-dim); background:rgba(0,255,102,0.05); box-shadow:0 0 24px rgba(0,255,102,0.1);}
  .dropzone input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .dropzone .dz-title{font-size:13.5px; font-weight:600; color:var(--text);}
  .dropzone .dz-sub{font-size:12px; color:var(--text-faint); margin-top:4px; font-family:var(--mono);}
  .filestatus{
    margin-top:12px; padding:10px 14px; border-radius:8px;
    background:var(--panel-raised); border:1px solid var(--line);
    font-family:var(--mono); font-size:12px; color:var(--teal);
    display:none; align-items:center; justify-content:space-between; gap:10px;
  }
  .filestatus.show{display:flex;}
  .filestatus .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .filestatus .frows{color:var(--text-faint); white-space:nowrap;}

  .controls-row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:16px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11px; color:var(--text-dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:0.5px;}
  select, .btn{
    font-family:var(--sans); font-size:13px;
  }
  select{
    background:var(--panel-raised); color:var(--text); border:1px solid var(--line);
    padding:9px 12px; border-radius:8px; min-width:160px; cursor:pointer;
  }
  .checkfield{display:flex; align-items:center; gap:8px; padding:9px 2px;}
  .checkfield input{width:16px; height:16px; accent-color:var(--amber);}
  .checkfield label{font-size:13px; color:var(--text); cursor:pointer;}

  .btn{
    appearance:none; border:1px solid var(--line); background:var(--panel-raised); color:var(--text);
    padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600;
    display:inline-flex; align-items:center; gap:7px;
    transition:transform .1s, border-color .15s, background .15s, box-shadow .15s;
  }
  .btn:hover{border-color:var(--amber-dim); background:rgba(0,255,102,0.08); box-shadow:0 0 20px rgba(0,255,102,0.12);}
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--amber); border-color:var(--amber); color:#04140A; box-shadow:0 0 24px rgba(0,255,102,0.3);}
  .btn.primary:hover{background:#3dffa0; box-shadow:0 0 36px rgba(0,255,102,0.48);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

  .resultbar{
    display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;
  }
  .statcard{
    flex:1; min-width:120px;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px;
  }
  .statcard .n{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--amber); text-shadow:0 0 12px rgba(0,255,102,0.4);}
  .statcard .l{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}

  textarea.idlist{
    width:100%; min-height:120px; margin-top:14px;
    background:rgba(0,0,0,0.4); color:var(--teal); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; font-family:var(--mono); font-size:12.5px; line-height:1.6;
    resize:vertical;
  }

  table.pivot{
    width:100%; border-collapse:collapse; margin-top:16px;
    font-family:var(--mono); font-size:12.5px;
  }
  table.pivot th, table.pivot td{
    border-bottom:1px solid var(--line); padding:9px 12px; text-align:left;
  }
  table.pivot th{
    color:var(--text-dim); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:0.5px;
    background:rgba(255,255,255,0.02);
  }
  table.pivot td.num{text-align:right; color:var(--text);}
  table.pivot tr.totalrow td{font-weight:700; color:var(--amber); border-top:1.5px solid var(--amber-dim); border-bottom:none; text-shadow:0 0 10px rgba(0,255,102,0.3);}
  table.pivot tbody tr:hover{background:rgba(255,255,255,0.02);}
  .tablewrap{max-height:420px; overflow:auto; border-radius:8px;}

  .empty{
    color:var(--text-faint); font-size:13px; text-align:center; padding:24px; font-family:var(--mono);
  }
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-family:var(--mono);
    font-weight:600; letter-spacing:0.3px;
  }
  .badge.warn{background:rgba(224,102,90,0.15); color:var(--red);}
  .badge.ok{background:rgba(95,191,143,0.15); color:var(--green);}
  a.toastlink{color:var(--teal);}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  /* --- added: search / filters / view toggle / cards / pager / badges --- */
  .toolsrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 4px;}
  .searchbox{
    display:flex; align-items:center; gap:8px; flex:1; min-width:180px;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
    transition:border-color .2s, box-shadow .2s;
  }
  .searchbox:focus-within{border-color:rgba(0,255,102,0.4); box-shadow:0 0 16px rgba(0,255,102,0.15);}
  .searchbox input{
    background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; font-family:var(--sans);
  }
  .searchbox svg{flex-shrink:0; opacity:0.5;}
  .chipbar{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    appearance:none; border:1px solid var(--line); background:var(--panel-raised); color:var(--text-dim);
    padding:7px 13px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer; font-family:var(--mono);
  }
  .chip.active{background:rgba(0,255,102,0.15); border-color:var(--amber-dim); color:var(--amber);}
  .viewtoggle{display:flex; gap:2px; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:3px;}
  .viewtoggle button{
    appearance:none; border:none; background:none; color:var(--text-dim); padding:6px 12px; border-radius:6px;
    font-size:11.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .viewtoggle button.active{background:rgba(0,255,102,0.15); color:var(--amber);}

  .badge2{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px;
    font-size:10.5px; font-weight:700; font-family:var(--mono); border:1px solid;
  }
  .badge2 .d{width:5px; height:5px; border-radius:50%;}

  .sellergrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:14px;}
  .sellercard{
    background:var(--panel-raised); border:1px solid var(--line); border-radius:10px; padding:14px 16px;
  }
  .sellercard .sc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .sellercard .sc-name{font-size:13.5px; font-weight:600; color:var(--text);}
  .sellercard .sc-id{font-size:10.5px; color:var(--text-faint); font-family:var(--mono); margin-top:2px;}
  .sellercard .sc-total{
    background:rgba(0,255,102,0.15); color:var(--amber); font-weight:700; font-size:16px;
    padding:3px 10px; border-radius:8px; font-family:var(--mono); flex-shrink:0;
  }
  .sellercard .sc-stats{display:flex; gap:6px; margin:10px 0;}
  .sellercard .sc-stat{flex:1; text-align:center; border-radius:7px; padding:6px 4px; background:rgba(255,255,255,0.02); border:1px solid var(--line);}
  .sellercard .sc-stat .v{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--teal);}
  .sellercard .sc-stat .l{font-size:9.5px; color:var(--text-faint); margin-top:1px;}
  .sellercard .sc-meta{font-size:11px; color:var(--text-faint); line-height:1.7; margin-top:4px;}
  .sellercard .sc-bar{height:3px; background:var(--line); border-radius:2px; margin-top:9px; overflow:hidden;}
  .sellercard .sc-bar-fill{height:100%; background:linear-gradient(90deg, var(--amber-dim), var(--amber));}

  .pager{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .pagebtn{
    background:var(--panel-raised); border:1px solid var(--line); border-radius:7px; padding:6px 11px;
    cursor:pointer; color:var(--text-dim); font-size:12px; font-family:var(--mono);
  }
  .pagebtn.active{background:rgba(0,255,102,0.15); border-color:var(--amber-dim); color:var(--amber); font-weight:700;}
  .pagebtn:disabled{opacity:0.3; cursor:not-allowed;}
  .pageinfo{color:var(--text-faint); font-size:11px; font-family:var(--mono);}
  td.ellip{max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ============ JARVIS AI COMMAND CENTER (Dashboard tab) ============ */
  .jcc{position:relative;}
  .jcc-spotlight{
    position:absolute; inset:0; pointer-events:none; z-index:0; border-radius:16px; overflow:hidden;
    background:radial-gradient(320px circle at var(--mx,50%) var(--my,20%), rgba(0,229,255,0.08), transparent 60%);
  }
  .jcc-topbar{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    padding:18px 22px; margin-bottom:18px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(14px);
  }
  .jcc-title{
    font-family:var(--display); font-weight:900; letter-spacing:2px; text-transform:uppercase;
    font-size:15px; color:var(--amber); text-shadow:0 0 18px rgba(0,255,102,0.5);
    display:flex; align-items:center; gap:10px;
  }
  .jcc-title .scan-dot{width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 10px var(--amber); animation:pulseGlow 1.4s infinite;}
  .jcc-meta{display:flex; align-items:center; gap:20px; font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .jcc-meta .jcc-time{color:var(--text); font-weight:700; font-size:13px;}
  .jcc-meta .jcc-user{display:flex; align-items:center; gap:7px;}
  .jcc-meta .avatar{
    width:26px; height:26px; border-radius:50%; background:conic-gradient(from 180deg, var(--amber), var(--teal), var(--purple));
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#050505; font-family:var(--display);
  }
  .jcc-meta .online-dot{width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); animation:pulseGlow 1.6s infinite;}

  .jcc-grid{position:relative; z-index:1; display:grid; grid-template-columns:210px 1fr 300px; gap:18px; align-items:start;}
  @media (max-width:1180px){ .jcc-grid{grid-template-columns:1fr;} }

  .jcc-sidebar{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 10px;
    display:flex; flex-direction:column; gap:4px; backdrop-filter:blur(14px);
  }
  .jcc-side-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; cursor:pointer;
    color:var(--text-dim); font-size:12.5px; font-weight:600; transition:all .18s; font-family:var(--sans);
  }
  .jcc-side-item svg{flex-shrink:0; opacity:0.75; transition:all .18s;}
  .jcc-side-item:hover{color:var(--text); background:rgba(0,255,102,0.06);}
  .jcc-side-item:hover svg{opacity:1; filter:drop-shadow(0 0 5px rgba(0,255,102,0.6));}
  .jcc-side-item.active{color:var(--amber); background:rgba(0,255,102,0.1); box-shadow:inset 0 0 0 1px rgba(0,255,102,0.25);}

  .jcc-main{display:flex; flex-direction:column; gap:18px;}

  .jcc-upload-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:820px){ .jcc-upload-grid{grid-template-columns:1fr;} }
  .jcc-upload-card{
    position:relative; background:var(--panel); border:1.5px dashed rgba(0,255,102,0.3); border-radius:14px;
    padding:20px 16px; text-align:center; cursor:pointer; backdrop-filter:blur(14px);
    transition:all .2s; overflow:hidden;
  }
  .jcc-upload-card::before{
    content:''; position:absolute; inset:0; border-radius:14px;
    box-shadow:0 0 0 0 rgba(0,255,102,0.25); animation:uploadPulse 2.6s ease-in-out infinite;
  }
  @keyframes uploadPulse{
    0%{box-shadow:0 0 0 0 rgba(0,255,102,0.18);}
    70%{box-shadow:0 0 0 14px rgba(0,255,102,0);}
    100%{box-shadow:0 0 0 0 rgba(0,255,102,0);}
  }
  .jcc-upload-card:hover{border-color:var(--amber); background:rgba(0,255,102,0.06); transform:translateY(-3px);}
  .jcc-upload-card .icn{width:40px; height:40px; margin:0 auto 10px; border-radius:10px; background:rgba(0,255,102,0.1); border:1px solid rgba(0,255,102,0.3); display:flex; align-items:center; justify-content:center;}
  .jcc-upload-card .t1{font-family:var(--display); font-size:12px; letter-spacing:0.5px; text-transform:uppercase; color:var(--text);}
  .jcc-upload-card .t2{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-top:4px;}

  .jcc-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  @media (max-width:920px){ .jcc-cards{grid-template-columns:repeat(2,1fr);} }
  .dcard{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; backdrop-filter:blur(14px); overflow:hidden; transition:all .2s;
  }
  .dcard:hover{border-color:rgba(0,255,102,0.4); transform:translateY(-3px); box-shadow:0 20px 40px rgba(0,255,102,0.1);}
  .dcard .lbl{font-family:var(--mono); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-faint);}
  .dcard .val{font-family:var(--display); font-size:26px; font-weight:900; color:var(--amber); margin-top:6px; text-shadow:0 0 14px rgba(0,255,102,0.35);}
  .dcard svg.spark{width:100%; height:26px; margin-top:8px; display:block;}
  .dcard .spark-line{fill:none; stroke:var(--teal); stroke-width:1.6; opacity:0.85;}

  .jcc-terminal{
    background:rgba(5,10,8,0.6); border:1px solid rgba(0,255,102,0.22); border-radius:14px; overflow:hidden; backdrop-filter:blur(14px);
  }
  .jcc-terminal .th{display:flex; align-items:center; gap:8px; padding:10px 16px; background:rgba(255,255,255,0.02); border-bottom:1px solid rgba(0,255,102,0.14);}
  .jcc-terminal .th span{width:9px; height:9px; border-radius:50%;}
  .jcc-terminal .th .r{background:#E0665A;} .jcc-terminal .th .y{background:#F2A93B;} .jcc-terminal .th .g{background:#00FF66;}
  .jcc-terminal .th .lbl{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint);}
  .jcc-terminal .tb{padding:14px 18px; font-family:var(--mono); font-size:12px; line-height:1.85; min-height:150px;}
  .jcc-terminal .tline{color:var(--amber); opacity:0;}
  .jcc-terminal .tline.done{opacity:1;}
  .jcc-terminal .tline .p{color:var(--text-faint); margin-right:6px;}
  .jcc-cursor{display:inline-block; width:7px; height:12px; background:var(--amber); margin-left:2px; animation:blink .9s steps(1) infinite; vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}

  .jcc-activity{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; backdrop-filter:blur(14px);
  }
  .jcc-act-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:12.5px;}
  .jcc-act-item:last-child{border-bottom:none;}
  .jcc-act-dot{width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 7px var(--amber); flex-shrink:0;}
  .jcc-act-time{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--text-faint); white-space:nowrap;}

  .jcc-right{display:flex; flex-direction:column; gap:16px;}
  .jcc-status-ring{position:relative; width:120px; height:120px; margin:6px auto;}
  .jcc-status-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
  .jcc-status-ring .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .jcc-status-ring .center .n{font-family:var(--mono); font-weight:700; font-size:20px; color:var(--amber);}
  .jcc-status-ring .center .l{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px;}
  .jcc-scan-ring{animation:spinDash 3.2s linear infinite;}
  @keyframes spinDash{to{transform:rotate(360deg);}}
  .jcc-status-rows{display:flex; flex-direction:column; gap:9px; margin-top:12px;}
  .jcc-status-row{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .jcc-status-row b{color:var(--amber); font-weight:700;}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px;
    backdrop-filter:blur(14px);
  }
  .panel-title{
    font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--text-faint); display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .panel-title .sq{width:6px; height:6px; background:var(--amber); box-shadow:0 0 6px var(--amber);}

  /* CityMall dashboard extras */
  tr.action-row td{
    background:rgba(224,102,90,0.08) !important;
    box-shadow:inset 3px 0 0 var(--red);
  }
  .remark-none{color:var(--red); font-weight:600; font-size:11.5px;}
  .remark-ok{color:var(--text); font-size:12px;}
  .remark-date{color:var(--text-faint); font-family:var(--mono); font-size:10.5px; display:block; margin-top:2px;}
  .action-badge{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--red); border:1px solid rgba(224,102,90,0.5); background:rgba(224,102,90,0.1);
    padding:2px 7px; border-radius:10px; margin-left:6px;
  }
</style>
</head>

/* ---------------- HELPERS ---------------- */
function cleanId(v){ return (v===undefined||v===null) ? '' : String(v).replace(/["',]/g,'').trim(); }
function normYesNo(v){ return (v===undefined||v===null) ? '' : String(v).trim().toLowerCase(); }
function normStatus(v){ return (v===undefined||v===null) ? '' : String(v).trim().toUpperCase(); }

function parseDate(str, fmt){
  if(!str) return null;
  str = String(str).trim();
  if(fmt==='ymd'){
    const p = str.split('-'); if(p.length!==3) return null;
    return new Date(+p[0], +p[1]-1, +p[2]);
  } else {
    const p = str.split('-'); if(p.length!==3) return null;
    return new Date(+p[2], +p[1]-1, +p[0]);
  }
}

function toCSV(rows){
  if(!rows || !rows.length) return '';
  const cols = Object.keys(rows[0]);
  const esc = v => { v = (v===undefined||v===null) ? '' : String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  return [cols.join(','), ...rows.map(r => cols.map(c=>esc(r[c])).join(','))].join('\n');
}
function downloadCSV(filename, rows){
  const csv = toCSV(rows);
  if(!csv){ alert('Download karne ke liye koi data nahi hai.'); return; }
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function parseCSVFile(file, cb){
  Papa.parse(file, {
    header:true, skipEmptyLines:true, dynamicTyping:false,
    transformHeader: h => h.trim(),
    complete: res => cb(res.data.filter(r => Object.values(r).some(v => v!==undefined && v!==null && String(v).trim()!==''))),
    error: err => alert('File parse error: '+err.message)
  });
}

function dashAggregate(){
  let orderIds=0, dates=0, latest='—', pending=0, matched=0, notFoundTotal=0;
  const latestPerTab = [];
  TABS.forEach(t=>{
    const s = state[t.id];
    orderIds += (s.filteredOrderIds||[]).length;
    dates += (s.dateOptions||[]).length;
    if(s.dateOptions && s.dateOptions[0]) latestPerTab.push(s.dateOptions[0]);
    matched += (s.matchedRows||[]).length;
    notFoundTotal += (s.notFound||0);
  });
  if(latestPerTab.length) latest = latestPerTab.sort().reverse()[0];
  const total = orderIds;
  const completed = Math.max(0, total - matched - notFoundTotal);
  const acceptance = total>0 ? ((matched/total)*100).toFixed(1) : '0.0';
  return {orderIds, dates, latest, total, pending: matched, completed, acceptance, notFoundTotal};
}

function sparkPath(seed){
  // deterministic-ish decorative sparkline
  let v = seed*13 % 97;
  const pts = [];
  for(let i=0;i<8;i++){ v = (v*17+11)%97; pts.push(20 - (v/97)*18); }
  return pts.map((y,i)=> `${i*14},${y.toFixed(1)}`).join(' ');
}

    <div class="lbl">${label}</div>
    <div class="val">${value}</div>
    <svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none"><polyline class="spark-line" points="${sparkPath(seed)}"/></svg>
  </div>`;
}

function ldSetStatus(msg, isErr){

function ldNormalizeUrl(input){
  let url = input.trim();
  // already a proper export link — leave as-is
  if(/output=csv|gviz\/tq/.test(url)) return url;
  // try to pull sheet id + gid out of a normal share/edit link
  const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if(!idMatch) return url; // not recognisable, pass through and let fetch fail with a clear message
  const sheetId = idMatch[1];
  const gidMatch = url.match(/[#?&]gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;
}

function ldConnect(){
  const url = document.getElementById('ldUrl').value.trim();
  const headerRow = parseInt(document.getElementById('ldHeaderRow').value)||1;
  const interval = parseInt(document.getElementById('ldInterval').value)||0;
  const yesOnly = document.getElementById('ldYesOnly').checked;
  if(!url){ ldSetStatus('Pehle sheet link daalo.', true); return; }
  ldSaveConfig({url, headerRow, interval, yesOnly});
  if(ldTimer){ clearInterval(ldTimer); ldTimer = null; }
  if(interval>0){ ldTimer = setInterval(ldRefreshNow, interval); }
  ldRefreshNow();
}

function ldRefreshNow(){
  const cfg = ldSavedConfig();
  if(!cfg.url){ ldSetStatus('Pehle Connect & Load dabao.', true); return; }
  ldSetStatus('Syncing...');
  const finalUrl = ldNormalizeUrl(cfg.url);
  const bust = (finalUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
  fetch(finalUrl + bust)
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(text=>{
      const trimmed = text.trim();
      if(trimmed.startsWith('<') || trimmed.includes('accounts.google.com') || trimmed.toLowerCase().includes('<!doctype html')){
        throw new Error('Sheet private hai ya sharing "Anyone with the link" par set nahi hai');
      }
      const parsed = Papa.parse(trimmed, {skipEmptyLines:true});
      if(!parsed.data.length){ throw new Error('CSV khaali aaya — sahi tab/gid check karo'); }
      ldRenderTable(parsed.data, cfg.headerRow||1, cfg.yesOnly!==false);
      ldSetStatus('Last synced ' + new Date().toLocaleTimeString('en-IN'));
    })
    .catch(err=>{
      ldSetStatus('Sync failed: ' + err.message + '. Sheet ko "Share → Anyone with the link → Viewer" karo, ya normal share/edit link hi paste karo — hum khud sahi format bana lenge.', true);
    });
}

function ldFindCol(headers, patterns){
  const norm = headers.map(h => (h||'').toString().toLowerCase().replace(/[^a-z0-9]/g,''));
  for(const p of patterns){
    const idx = norm.findIndex(h => h.includes(p));
    if(idx !== -1) return idx;
  }
  return -1;
}

function ldLooksLikeRawOrders(headers){
  const hasDateCol = ldFindCol(headers, ['orderlandingdate','date']) !== -1;
  const hasIdCol = ldFindCol(headers, ['id']) !== -1;
  const hasSellerId = ldFindCol(headers, ['sellerid']) !== -1;
  const multiDateCols = headers.filter(h => /^\d{4}-\d{2}-\d{2}$/.test((h||'').trim())).length;
  return hasDateCol && hasIdCol && hasSellerId && multiDateCols === 0;
}

function ldNormYesNo(v){
  return (v||'').toString().trim().toLowerCase();
}

function ldBuildPivotFromRaw(headers, rows, windowDays, yesOnly){
  const dateIdx = ldFindCol(headers, ['orderlandingdate','date']);
  const idIdx = ldFindCol(headers, ['id']);
  const sellerIdIdx = ldFindCol(headers, ['sellerid']);
  const nameIdx = ldFindCol(headers, ['sellername','suppliername','name']);
  const phoneIdx = ldFindCol(headers, ['phone']);
  const yesNoIdx = ldFindCol(headers, ['newlandingbefore11am','landingbefore11am']);

  let workRows = rows;
  if(yesOnly && yesNoIdx !== -1){
    workRows = rows.filter(r => ldNormYesNo(r[yesNoIdx]) === 'yes');
  }

  const sellers = {};
  const allDates = new Set();
  workRows.forEach(r=>{
    const sid = (r[sellerIdIdx]||'').toString().trim();
    if(!sid) return;
    const date = (r[dateIdx]||'').toString().trim();
    const oid = (r[idIdx]||'').toString().trim();
    if(!sellers[sid]) sellers[sid] = {name:r[nameIdx]||'', phone:r[phoneIdx]||'', dateIds:{}, allIds:new Set()};
    if(date){ allDates.add(date); if(!sellers[sid].dateIds[date]) sellers[sid].dateIds[date] = new Set(); sellers[sid].dateIds[date].add(oid); }
    sellers[sid].allIds.add(oid);
  });

  const sortedDates = Array.from(allDates).sort();
  const shownDates = windowDays>0 ? sortedDates.slice(-windowDays) : sortedDates;

  const headerRowOut = ['seller_id','supplier_name','Seller Phone no', ...shownDates, 'Grand Total'];
  const bodyRows = Object.keys(sellers).sort((a,b)=>Number(a)-Number(b)).map(sid=>{
    const s = sellers[sid];
    const row = [sid, s.name, s.phone];
    shownDates.forEach(d=> row.push(s.dateIds[d] ? s.dateIds[d].size : ''));
    row.push(s.allIds.size);
    return row;
  });
  const totals = ['Grand Total','',''];
  shownDates.forEach(d=>{
    let sum = 0;
    Object.values(sellers).forEach(s=>{ if(s.dateIds[d]) sum += s.dateIds[d].size; });
    totals.push(sum);
  });
  let grandAll = 0; Object.values(sellers).forEach(s=> grandAll += s.allIds.size);
  totals.push(grandAll);
  bodyRows.push(totals);

  return {headers: headerRowOut, rows: bodyRows};
}

let ldLastHeaders = null, ldLastRows = null;

function ldRenderTable(data, headerRow, yesOnly){
  const card = document.getElementById('ldTableCard');
  const table = document.getElementById('ldTable');
  if(!data || data.length < headerRow){ ldSetStatus('Sheet me data nahi mila.', true); return; }
  let headers = data[headerRow-1];
  let rows = data.slice(headerRow).filter(r => r.some(c => (c||'').toString().trim() !== ''));

  if(ldLooksLikeRawOrders(headers)){
    const pivot = ldBuildPivotFromRaw(headers, rows, 0, yesOnly);
    headers = pivot.headers;
    rows = pivot.rows;
  }

  ldLastHeaders = headers;
  ldLastRows = rows;

  const dateColIdx = headers.map(h => /^\d{4}-\d{2}-\d{2}$/.test((h||'').trim()) || /^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test((h||'').trim()) || (h||'').toString().toLowerCase().includes('grand total'));
  const firstDateIdx = dateColIdx.indexOf(true);
  const rightAlignFrom = firstDateIdx === -1 ? headers.length : firstDateIdx;

  let thead = '<thead><tr>' + headers.map((h,i)=>`<th${i>=rightAlignFrom?' style="text-align:right;"':''}>${h||''}</th>`).join('') + '</tr></thead>';
  let tbody = '<tbody>' + rows.map(r=>{
    const isGrand = (r[0]||'').toString().toLowerCase().includes('grand total');
    return `<tr class="${isGrand?'totalrow':''}">` + headers.map((h,i)=>{
      const v = r[i]!==undefined ? r[i] : '';
      const align = i>=rightAlignFrom ? ' class="num"' : '';
      return `<td${align}>${v}</td>`;
    }).join('') + '</tr>';
  }).join('') + '</tbody>';

  table.innerHTML = thead + tbody;
  card.style.display = 'block';
}

function ldDownloadPivotCSV(){
  if(!ldLastHeaders || !ldLastRows){ alert('Pehle data load karo.'); return; }
  const objRows = ldLastRows.map(r => {
    const obj = {};
    ldLastHeaders.forEach((h,i)=> obj[h||('col'+i)] = r[i]!==undefined ? r[i] : '');
    return obj;
  });
  downloadCSV('live_sheet_pivot_full.csv', objRows);
}

function cmConnect(){

function cmFetchCsv(url){
  const finalUrl = ldNormalizeUrl(url);
  const bust = (finalUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
  return fetch(finalUrl + bust).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(text=>{
    const trimmed = text.trim();
    if(trimmed.startsWith('<') || trimmed.toLowerCase().includes('<!doctype html') || trimmed.includes('accounts.google.com')){
      throw new Error('Sheet private hai ya sharing sahi nahi hai');
    }
    const parsed = Papa.parse(trimmed, {skipEmptyLines:true});
    if(!parsed.data.length) throw new Error('CSV khaali aaya');
    return parsed.data;
  });
}

function cmRefreshNow(){
  const cfg = cmSavedConfig();
  if(!cfg.ordersUrl || !cfg.callingUrl){ cmSetStatus('Pehle Connect & Load dabao.', true); return; }
  cmSetStatus('Syncing...');
  Promise.all([cmFetchCsv(cfg.ordersUrl), cmFetchCsv(cfg.callingUrl)])
    .then(([ordersData, callingData])=>{
      const ordersHeaders = ordersData[(cfg.ordersHeaderRow||1)-1];
      const ordersRows = ordersData.slice(cfg.ordersHeaderRow||1).filter(r => r.some(c => (c||'').toString().trim() !== ''));
      const callingHeaders = callingData[(cfg.callingHeaderRow||1)-1];
      const callingRows = callingData.slice(cfg.callingHeaderRow||1).filter(r => r.some(c => (c||'').toString().trim() !== ''));

      const pivot = cmBuildPivot(ordersHeaders, ordersRows, callingHeaders, callingRows, cfg.yesOnly!==false);
      cmRenderTable(pivot);
      cmSetStatus('Last synced ' + new Date().toLocaleTimeString('en-IN'));
    })
    .catch(err=>{
      cmSetStatus('Sync failed: ' + err.message + '. Dono sheets "Anyone with the link" par set karo.', true);
    });
}

function cmBuildCallingMap(callingHeaders, callingRows){
  const sellerIdIdx = ldFindCol(callingHeaders, ['sellerid']);
  const remarkIdx = ldFindCol(callingHeaders, ['callingremark','remark','status','callstatus']);
  const dateIdx = ldFindCol(callingHeaders, ['callingdate','calldate','date']);
  const map = {};
  callingRows.forEach(r=>{
    const sid = (r[sellerIdIdx]||'').toString().trim();
    if(!sid) return;
    const remark = remarkIdx!==-1 ? (r[remarkIdx]||'').toString().trim() : '';
    const date = dateIdx!==-1 ? (r[dateIdx]||'').toString().trim() : '';
    if(!map[sid]) map[sid] = [];
    map[sid].push({remark, date});
  });
  // sort each seller's calls by date descending, latest first
  Object.keys(map).forEach(sid=>{
    map[sid].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  });
  return map;
}

function cmBuildPivot(headers, rows, callingHeaders, callingRows, yesOnly){
  const dateIdx = ldFindCol(headers, ['orderlandingdate','date']);
  const idIdx = ldFindCol(headers, ['id']);
  const sellerIdIdx = ldFindCol(headers, ['sellerid']);
  const nameIdx = ldFindCol(headers, ['sellername','suppliername','name']);
  const phoneIdx = ldFindCol(headers, ['phone']);
  const yesNoIdx = ldFindCol(headers, ['newlandingbefore11am','landingbefore11am']);

  let workRows = rows;
  if(yesOnly && yesNoIdx !== -1){
    workRows = rows.filter(r => ldNormYesNo(r[yesNoIdx]) === 'yes');
  }

  const sellers = {};
  const allDates = new Set();
  workRows.forEach(r=>{
    const sid = (r[sellerIdIdx]||'').toString().trim();
    if(!sid) return;
    const date = (r[dateIdx]||'').toString().trim();
    const oid = (r[idIdx]||'').toString().trim();
    if(!sellers[sid]) sellers[sid] = {name:r[nameIdx]||'', phone:r[phoneIdx]||'', dateIds:{}, allIds:new Set()};
    if(date){ allDates.add(date); if(!sellers[sid].dateIds[date]) sellers[sid].dateIds[date] = new Set(); sellers[sid].dateIds[date].add(oid); }
    sellers[sid].allIds.add(oid);
  });

  const sortedDates = Array.from(allDates).sort();
  const recentWindow = sortedDates.slice(-3); // latest date + 2 days back

  const callingMap = cmBuildCallingMap(callingHeaders, callingRows);

  const headerRowOut = ['seller_id','supplier_name','Seller Phone no', ...sortedDates, 'Grand Total', 'Calling Remark'];
  const sids = Object.keys(sellers).sort((a,b)=>Number(a)-Number(b));
  const bodyRows = sids.map(sid=>{
    const s = sellers[sid];
    const row = [sid, s.name, s.phone];
    sortedDates.forEach(d=> row.push(s.dateIds[d] ? s.dateIds[d].size : ''));
    row.push(s.allIds.size);

    const calls = callingMap[sid];
    let remarkCell;
    if(!calls || !calls.length){
      remarkCell = {none:true};
    } else {
      remarkCell = {none:false, remark:calls[0].remark || '(remark khaali hai)', date:calls[0].date};
    }
    row.push(remarkCell);

    const needsAction = recentWindow.some(d => s.dateIds[d] && s.dateIds[d].size > 0);
    return {cells:row, needsAction};
  });

  const totals = ['Grand Total','',''];
  sortedDates.forEach(d=>{
    let sum = 0;
    Object.values(sellers).forEach(s=>{ if(s.dateIds[d]) sum += s.dateIds[d].size; });
    totals.push(sum);
  });
  let grandAll = 0; Object.values(sellers).forEach(s=> grandAll += s.allIds.size);
  totals.push(grandAll);
  totals.push({none:true, isTotalRow:true});
  bodyRows.push({cells:totals, needsAction:false});

  return {headers: headerRowOut, rows: bodyRows, dateCount: sortedDates.length};
}

let cmLastHeaders = null, cmLastRows = null;

function cmRenderTable(pivot){
  const card = document.getElementById('cmTableCard');
  const table = document.getElementById('cmTable');
  const headers = pivot.headers;
  cmLastHeaders = headers;
  cmLastRows = pivot.rows;

  const rightAlignFrom = 3; // date columns + grand total start right after seller_id/name/phone

  let thead = '<thead><tr>' + headers.map((h,i)=>`<th${i>=rightAlignFrom && i<headers.length-1?' style="text-align:right;"':''}>${h||''}</th>`).join('') + '</tr></thead>';
  let tbody = '<tbody>' + pivot.rows.map(row=>{
    const r = row.cells;
    const isGrand = (r[0]||'').toString().toLowerCase().includes('grand total');
    const rowClass = (row.needsAction && !isGrand) ? 'action-row' : (isGrand ? 'totalrow' : '');
    const cellsHtml = r.map((v,i)=>{
      if(i === headers.length-1){
        // calling remark cell
        if(v && v.isTotalRow) return '<td></td>';
        if(!v || v.none) return `<td><span class="remark-none">Calling nahi hui hai</span></td>`;
        return `<td><span class="remark-ok">${v.remark}</span>${v.date?`<span class="remark-date">${v.date}</span>`:''}</td>`;
      }
      const align = (i>=rightAlignFrom) ? ' class="num"' : '';
      return `<td${align}>${v!==undefined?v:''}</td>`;
    }).join('');
    return `<tr class="${rowClass}">${cellsHtml}${(row.needsAction && !isGrand)?'':''}</tr>`;
  }).join('') + '</tbody>';

  table.innerHTML = thead + tbody;
  card.style.display = 'block';
}

function cmDownloadCSV(){
  if(!cmLastHeaders || !cmLastRows){ alert('Pehle data load karo.'); return; }
  const objRows = cmLastRows.map(row=>{
    const obj = {};
    cmLastHeaders.forEach((h,i)=>{
      const v = row.cells[i];
      if(i === cmLastHeaders.length-1){
        obj[h||'calling_remark'] = (!v || v.none) ? 'Calling nahi hui hai' : `${v.remark}${v.date?' ('+v.date+')':''}`;
      } else {
        obj[h||('col'+i)] = v!==undefined ? v : '';
      }
    });
    return obj;
  });
  downloadCSV('citymall_pivot_with_calling.csv', objRows);
}

  // --- file 2 dropzone ---
  const dz2 = document.getElementById(`dz2-${t.id}`);
  const f2input = document.getElementById(`file2-${t.id}`);
  ['dragenter','dragover'].forEach(ev=>dz2.addEventListener(ev,e=>{e.preventDefault();dz2.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz2.addEventListener(ev,e=>{e.preventDefault();dz2.classList.remove('drag');}));
  dz2.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]){ f2input.files = e.dataTransfer.files; handleFile2(t, e.dataTransfer.files[0]); } });
  f2input.addEventListener('change', e=>{ if(e.target.files[0]) handleFile2(t, e.target.files[0]); });

  document.getElementById(`genBtn-${t.id}`).addEventListener('click', ()=>generateOrderIdList(t));
  document.getElementById(`matchBtn-${t.id}`).addEventListener('click', ()=>matchAndAnalyse(t));
}

function handleFile1(t, file){
  const s = state[t.id];
  parseCSVFile(file, rows=>{
    if(!rows.length || !(t.file1.dateCol in rows[0])){
      alert(`"${t.file1.label}" me expected column "${t.file1.dateCol}" nahi mili. Sahi file check karo.`);
      return;
    }
    s.file1Rows = rows; s.file1Name = file.name;
    const fs = document.getElementById(`fstatus1-${t.id}`);
    fs.classList.add('show');
    fs.querySelector('.fname').textContent = '✓ '+file.name;
    fs.querySelector('.frows').textContent = rows.length+' rows';

    // detect all unique dates, sorted desc — latest date gets the Yes/No filter, rest are taken in full
    const uniqueDates = [...new Set(rows.map(r=>String(r[t.file1.dateCol]||'').trim()).filter(Boolean))];
    uniqueDates.sort((a,b)=>{
      const da = parseDate(a, t.file1.dateFmt), db = parseDate(b, t.file1.dateFmt);
      if(!da||!db) return 0;
      return db-da;
    });
    s.dateOptions = uniqueDates;
    document.getElementById(`latestDateVal-${t.id}`).textContent = uniqueDates[0] || '—';
    document.getElementById(`controls1-${t.id}`).style.display = 'flex';
    document.getElementById(`step1result-${t.id}`).innerHTML = '';
  });
}

function handleFile2(t, file){
  const s = state[t.id];
  parseCSVFile(file, rows=>{
    if(!rows.length || !(t.file2.orderIdCol in rows[0])){
      alert(`"${t.file2.label}" me expected column "${t.file2.orderIdCol}" nahi mili. Sahi file check karo.`);
      return;
    }
    s.file2Rows = rows; s.file2Name = file.name;
    const fs = document.getElementById(`fstatus2-${t.id}`);
    fs.classList.add('show');
    fs.querySelector('.fname').textContent = '✓ '+file.name;
    fs.querySelector('.frows').textContent = rows.length+' rows';
    document.getElementById(`controls2-${t.id}`).style.display = 'flex';
  });
}

function generateOrderIdList(t){
  const s = state[t.id];
  if(!s.file1Rows) return;
  const latestDate = s.dateOptions[0];
  const yesOnly = document.getElementById(`yesOnly-${t.id}`).checked;

  // latest date: apply Yes/No filter (if checked). All other/older dates: take every row as-is.
  const rows = s.file1Rows.filter(r=>{
    const d = String(r[t.file1.dateCol]||'').trim();
    if(d === latestDate){
      return yesOnly ? (normYesNo(r[t.file1.yesnoCol]) === 'yes') : true;
    }
    return true;
  });
  const ids = [...new Set(rows.map(r=>cleanId(r[t.file1.orderIdCol])).filter(Boolean))];
  s.filteredOrderIds = ids;
  s.filteredRows = rows;

  const box = document.getElementById(`step1result-${t.id}`);
  if(!ids.length){
    box.innerHTML = `<div class="empty">Koi order ID nahi mili. "Latest date par sirf Yes" option check karo.</div>`;
    return;
  }

  // per-date breakdown for transparency
  const perDate = {};
  rows.forEach(r=>{ const d = String(r[t.file1.dateCol]||'').trim(); perDate[d] = (perDate[d]||0)+1; });
  const dateRowsHtml = s.dateOptions.map(d=>{
    const tag = d===latestDate ? `<span class="badge ${yesOnly?'ok':'warn'}">${yesOnly?'Yes only':'all'}</span>` : `<span class="badge ok">all</span>`;
    return `<tr><td>${d}${d===latestDate?' <span style="color:var(--amber); font-family:var(--mono); font-size:10px;">(latest)</span>':''}</td><td class="num">${perDate[d]||0}</td><td>${tag}</td></tr>`;
  }).join('');

  box.innerHTML = `
    <div class="resultbar">
      <div class="statcard"><div class="n">${ids.length}</div><div class="l">Order IDs (sabhi dates)</div></div>
      <div class="statcard"><div class="n">${s.dateOptions.length}</div><div class="l">Dates cover ki</div></div>
      <div class="statcard"><div class="n">${latestDate}</div><div class="l">Latest date</div></div>
    </div>
    <div class="tablewrap" style="max-height:200px; margin-top:14px;">
      <table class="pivot">
        <thead><tr><th>Date</th><th class="num">Rows</th><th>Filter applied</th></tr></thead>
        <tbody>${dateRowsHtml}</tbody>
      </table>
    </div>
    <textarea class="idlist" id="idtext-${t.id}" readonly>${ids.join('\n')}</textarea>
    <div class="btn-row">
      <button class="btn" id="copyBtn-${t.id}">📋 Copy list</button>
      <button class="btn" id="dlIds-${t.id}">⬇ Order ID CSV download</button>
      <button class="btn ghost" id="dlFiltered-${t.id}">⬇ Poori filtered rows CSV</button>
    </div>
  `;
  document.getElementById(`copyBtn-${t.id}`).onclick = ()=>{
    navigator.clipboard.writeText(ids.join('\n')).then(()=>{
      const btn = document.getElementById(`copyBtn-${t.id}`);
      const old = btn.textContent; btn.textContent = '✓ Copied'; setTimeout(()=>btn.textContent=old, 1400);
    });
  };
  document.getElementById(`dlIds-${t.id}`).onclick = ()=> downloadCSV(`${t.id}_order_ids_all_dates.csv`, ids.map(id=>({order_id:id})));
  document.getElementById(`dlFiltered-${t.id}`).onclick = ()=> downloadCSV(`${t.id}_filtered_rows_all_dates.csv`, rows);
}

function matchAndAnalyse(t){
  const s = state[t.id];
  if(!s.filteredOrderIds.length){ alert('Pehle Step 1 me order ID list banao.'); return; }
  if(!s.file2Rows){ alert(`Pehle "${t.file2.label}" file upload karo.`); return; }

  // build lookup map from file2, keyed by cleaned order id
  const map = {};
  s.file2Rows.forEach(r=>{
    const id = cleanId(r[t.file2.orderIdCol]);
    if(!id) return;
    if(!map[id]) map[id] = [];
    map[id].push(r);
  });

  // seller id/name/phone/email/kam lookup sourced from file1 (raw data), keyed by cleaned order id
  const idInfo = {};
  if(t.pivotWithSellerId){
    s.filteredRows.forEach(r=>{
      const id = cleanId(r[t.file1.orderIdCol]);
      if(!id) return;
      idInfo[id] = {
        sellerId: String(r[t.file1.sellerIdCol]||'Unknown').trim() || 'Unknown',
        sellerName: String(r[t.file1.sellerNameCol]||'Unknown').trim() || 'Unknown',
        sellerPhone: String(r[t.file1.sellerPhoneCol]||'').trim(),
        sellerEmail: String(r[t.file1.sellerEmailCol]||'').trim(),
        kam: String(r[t.file1.kamCol]||'').trim()
      };
    });
  }

  const wantedStatuses = t.statuses.map(normStatus);
  let matched = [];
  let notFound = 0;
  s.filteredOrderIds.forEach(id=>{
    const rows = map[id];
    if(!rows){ notFound++; return; }
    rows.forEach(r=>{
      const st = normStatus(r[t.file2.statusCol]);
      if(wantedStatuses.includes(st)){
        const info = idInfo[id] || {};
        matched.push(Object.assign({matched_order_id:id, _status:st,
          seller_id:info.sellerId||'', seller_name:info.sellerName||'', seller_phone:info.sellerPhone||''
        }, r, {order_status: r[t.file2.statusCol]}));
      }
    });
  });

  // pivot: (seller id + seller name) x status, or plain seller name x status for CDC
  const pivotMap = {};
  matched.forEach(r=>{
    let key, sellerId, sellerName, sellerPhone, sellerEmail, kam;
    if(t.pivotWithSellerId){
      const info = idInfo[r.matched_order_id] || {sellerId:'Unknown', sellerName:'Unknown', sellerPhone:'', sellerEmail:'', kam:''};
      sellerId = info.sellerId; sellerName = info.sellerName; sellerPhone = info.sellerPhone;
      sellerEmail = info.sellerEmail; kam = info.kam;
      key = sellerId + ' || ' + sellerName;
    } else {
      sellerName = String(r[t.file2.sellerCol]||'Unknown').trim() || 'Unknown';
      key = sellerName;
    }
    if(!pivotMap[key]) pivotMap[key] = {sellerId, sellerName, sellerPhone, sellerEmail, kam, counts:{}};
    pivotMap[key].counts[r._status] = (pivotMap[key].counts[r._status]||0) + 1;
  });

  // persist to state for re-renders (search/filter/page/view changes)
  s.matchedRows = matched; s.pivot = pivotMap; s.notFound = notFound; s.wantedStatuses = wantedStatuses;
  s.search=''; s.statusFilter='ALL'; s.page=1; s.summaryView='table';

  renderStep2Result(t);
}

/* -------- interaction handlers (called from inline attrs) -------- */
function setSearch(id, val){ state[id].search = val; state[id].page = 1; renderStep2Result(TABS.find(t=>t.id===id)); }
function setStatusFilter(id, val){ state[id].statusFilter = val; state[id].page = 1; renderStep2Result(TABS.find(t=>t.id===id)); }
function setPage(id, p){ state[id].page = p; renderStep2Result(TABS.find(t=>t.id===id)); }
function setSummaryView(id, view){ state[id].summaryView = view; renderStep2Result(TABS.find(t=>t.id===id)); }

function renderStep2Result(t){
  const s = state[t.id];
  const matched = s.matchedRows, pivotMap = s.pivot, notFound = s.notFound, statuses = s.wantedStatuses;
  const box = document.getElementById(`step2result-${t.id}`);
  if(!matched || !matched.length){
    const empty0 = `<div class="empty">Status filter (${(statuses||[]).join(', ')}) ke liye koi matched data nahi mila.</div>`;
    box.innerHTML = matched ? `<div class="resultbar">
      <div class="statcard"><div class="n">${s.filteredOrderIds.length}</div><div class="l">IDs searched</div></div>
      <div class="statcard"><div class="n">0</div><div class="l">Matched rows</div></div>
      <div class="statcard"><div class="n" style="color:${notFound>0?'var(--red)':'var(--green)'}">${notFound}</div><div class="l">Not found in file 2</div></div>
    </div>${empty0}` : '';
    return;
  }
  const keys = Object.keys(pivotMap).sort((a,b)=> {
    const ta = statuses.reduce((s,st)=>s+(pivotMap[a].counts[st]||0),0);
    const tb = statuses.reduce((s,st)=>s+(pivotMap[b].counts[st]||0),0);
    return tb-ta;
  });

  const statCards = `
    <div class="statcard"><div class="n">${s.filteredOrderIds.length}</div><div class="l">IDs searched</div></div>
    <div class="statcard"><div class="n">${matched.length}</div><div class="l">Matched rows</div></div>
    <div class="statcard"><div class="n">${keys.length}</div><div class="l">Sellers</div></div>
    <div class="statcard"><div class="n" style="color:${notFound>0?'var(--red)':'var(--green)'}">${notFound}</div><div class="l">Not found in file 2</div></div>
  `;

  const totals = {}; statuses.forEach(st=>totals[st]=0);
  let grandTotal = 0;
  keys.forEach(k=> statuses.forEach(st=>{ totals[st]+= (pivotMap[k].counts[st]||0); grandTotal += (pivotMap[k].counts[st]||0); }));
  const maxTotal = Math.max(1, ...keys.map(k=> statuses.reduce((sum,st)=>sum+(pivotMap[k].counts[st]||0),0)));

  const withId = t.pivotWithSellerId;

  /* ---- seller summary: table view ---- */
  const sellerHeadCols = withId ? `<th>Seller ID</th><th>Seller Name</th><th>Seller Phone</th>` : `<th>Seller</th>`;
  const theadCols = statuses.map(st=>`<th class="num">${st}</th>`).join('') + `<th class="num">Qty (Total)</th>`;
  const bodyRows = keys.map(k=>{
    const p = pivotMap[k];
    const rowTotal = statuses.reduce((s2,st)=>s2+(p.counts[st]||0),0);
    const cells = statuses.map(st=>`<td class="num">${p.counts[st]||0}</td>`).join('') + `<td class="num" style="font-weight:700;">${rowTotal}</td>`;
    const sellerCells = withId ? `<td>${p.sellerId}</td><td>${p.sellerName}</td><td>${p.sellerPhone||'—'}</td>` : `<td>${p.sellerName}</td>`;
    return `<tr>${sellerCells}${cells}</tr>`;
  }).join('');
  const totalLabelColspan = withId ? 3 : 1;
  const totalRow = `<tr class="totalrow"><td colspan="${totalLabelColspan}">TOTAL</td>${statuses.map(st=>`<td class="num">${totals[st]}</td>`).join('')}<td class="num">${grandTotal}</td></tr>`;

  const summaryTableHtml = `
    <div class="tablewrap">
      <table class="pivot">
        <thead><tr>${sellerHeadCols}${theadCols}</tr></thead>
        <tbody>${bodyRows}${totalRow}</tbody>
      </table>
    </div>`;

  /* ---- seller summary: card view ---- */
  const statusPalette = {}; const palette = ['#00FF66','#00E5FF','#7C3AED','#E0665A'];
  statuses.forEach((st,i)=> statusPalette[st] = palette[i % palette.length]);
  const summaryCardsHtml = `
    <div class="sellergrid">
      ${keys.map(k=>{
        const p = pivotMap[k];
        const rowTotal = statuses.reduce((s2,st)=>s2+(p.counts[st]||0),0);
        return `<div class="sellercard">
          <div class="sc-top">
            <div><div class="sc-name">${withId ? p.sellerName : p.sellerName}</div>${withId?`<div class="sc-id">ID: ${p.sellerId}</div>`:''}</div>
            <div class="sc-total">${rowTotal}</div>
          </div>
          <div class="sc-stats">
            ${statuses.map(st=>`<div class="sc-stat"><div class="v" style="color:${statusPalette[st]}">${p.counts[st]||0}</div><div class="l">${st}</div></div>`).join('')}
          </div>
          <div class="sc-meta">
            ${p.sellerPhone ? `<div>📞 ${p.sellerPhone}</div>`:''}
            ${p.sellerEmail ? `<div>✉ ${p.sellerEmail}</div>`:''}
            ${p.kam ? `<div>👤 KAM: ${p.kam}</div>`:''}
          </div>
          <div class="sc-bar"><div class="sc-bar-fill" style="width:${Math.min(100,(rowTotal/maxTotal)*100)}%;"></div></div>
        </div>`;
      }).join('')}
    </div>`;

  /* ---- detail records: search + status chip filter + pagination ---- */
  const cols = t.detailColumns || [];
  const search = (s.search||'').toLowerCase();
  const filtered = matched.filter(r=>{
    const statusOk = s.statusFilter==='ALL' || r._status===s.statusFilter;
    const searchOk = !search || cols.some(c=> String(r[c.key]||'').toLowerCase().includes(search));
    return statusOk && searchOk;
  });
  const PER = 20;
  const pages = Math.max(1, Math.ceil(filtered.length/PER));
  if(s.page > pages) s.page = pages;
  const pageData = filtered.slice((s.page-1)*PER, s.page*PER);

  const chipbarHtml = `
    <button class="chip ${s.statusFilter==='ALL'?'active':''}" onclick="setStatusFilter('${t.id}','ALL')">ALL (${matched.length})</button>
    ${statuses.map(st=>`<button class="chip ${s.statusFilter===st?'active':''}" onclick="setStatusFilter('${t.id}','${st}')">${st} (${totals[st]||0})</button>`).join('')}
  `;

  const detailTableHtml = pageData.length===0 ? `<div class="empty">Search/filter ke liye koi record nahi mila.</div>` : `
    <div class="tablewrap" style="max-height:420px;">
      <table class="pivot">
        <thead><tr><th>#</th>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
        <tbody>
          ${pageData.map((r,i)=>`<tr>
            <td class="num" style="color:var(--text-faint);">${(s.page-1)*PER+i+1}</td>
            ${cols.map(c=>{
              if(c.key==='order_status'){
                const col = statusPalette[r._status] || 'var(--teal)';
                return `<td><span class="badge2" style="color:${col}; border-color:${col}44; background:${col}22;"><span class="d" style="background:${col};"></span>${r._status}</span></td>`;
              }
              const val = r[c.key];
              return `<td class="ellip" title="${String(val||'').replace(/"/g,'&quot;')}">${val || '—'}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${pages>1 ? `<div class="pager">
      <button class="pagebtn" ${s.page===1?'disabled':''} onclick="setPage('${t.id}',${s.page-1})">‹</button>
      ${Array.from({length:Math.min(7,pages)},(_,i)=>{
        let p = pages<=7 ? i+1 : s.page<=4 ? i+1 : s.page>=pages-3 ? pages-6+i : s.page-3+i;
        return `<button class="pagebtn ${s.page===p?'active':''}" onclick="setPage('${t.id}',${p})">${p}</button>`;
      }).join('')}
      <button class="pagebtn" ${s.page===pages?'disabled':''} onclick="setPage('${t.id}',${s.page+1})">›</button>
      <span class="pageinfo">${(s.page-1)*PER+1}–${Math.min(s.page*PER,filtered.length)} / ${filtered.length}</span>
    </div>` : ''}
  `;

  box.innerHTML = `
    <div class="resultbar">${statCards}</div>

    <div class="toolsrow">
      <h2 style="font-size:14px; margin:0; flex-basis:100%;">Seller Summary</h2>
    </div>
    <div class="toolsrow">
      <div class="viewtoggle">
        <button class="${s.summaryView==='table'?'active':''}" onclick="setSummaryView('${t.id}','table')">▤ Table</button>
        <button class="${s.summaryView==='cards'?'active':''}" onclick="setSummaryView('${t.id}','cards')">▦ Cards</button>
      </div>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn primary" id="dlPivot-${t.id}">⬇ Pivot summary CSV</button>
        <button class="btn" id="dlDetail-${t.id}">⬇ Poora matched data CSV</button>
        <button class="btn ghost" id="dlNotFound-${t.id}">⬇ Not-found IDs CSV</button>
      </div>
    </div>
    ${s.summaryView==='table' ? summaryTableHtml : summaryCardsHtml}

    <div class="toolsrow" style="margin-top:26px;">
      <h2 style="font-size:14px; margin:0; flex-basis:100%;">Detail Records</h2>
    </div>
    <div class="toolsrow">
      <div class="searchbox">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Order ID, seller, AWB, customer... search karo" value="${s.search||''}" oninput="setSearch('${t.id}', this.value)">
      </div>
      <div class="chipbar">${chipbarHtml}</div>
    </div>
    ${detailTableHtml}
  `;

  document.getElementById(`dlPivot-${t.id}`).onclick = ()=>{
    const pivotRows = keys.map(k=>{
      const p = pivotMap[k];
      const row = withId ? {seller_id:p.sellerId, seller_name:p.sellerName, seller_phone:p.sellerPhone||'', seller_email:p.sellerEmail||'', kam:p.kam||''} : {seller:p.sellerName};
      statuses.forEach(st=> row[st] = p.counts[st]||0);
      row.qty_total = statuses.reduce((s2,st)=>s2+(p.counts[st]||0),0);
      return row;
    });
    const totalRowObj = withId ? {seller_id:'TOTAL', seller_name:'', seller_phone:'', seller_email:'', kam:''} : {seller:'TOTAL'};
    statuses.forEach(st=> totalRowObj[st]=totals[st]);
    totalRowObj.qty_total = grandTotal;
    pivotRows.push(totalRowObj);
    downloadCSV(`${t.id}_pivot_summary.csv`, pivotRows);
  };
  document.getElementById(`dlDetail-${t.id}`).onclick = ()=> downloadCSV(`${t.id}_matched_detail.csv`, matched);
  document.getElementById(`dlNotFound-${t.id}`).onclick = ()=>{
    const foundSet = new Set(matched.map(r=>r.matched_order_id));
    const allFile2Ids = new Set((s.file2Rows||[]).map(r=>cleanId(r[t.file2.orderIdCol])));
    const nf = s.filteredOrderIds.filter(id=> !allFile2Ids.has(id));
    if(!nf.length){ alert('Koi bhi order ID "not found" nahi hai.'); return; }
    downloadCSV(`${t.id}_not_found_ids.csv`, nf.map(id=>({order_id:id})));
  };
}

</script>
<script>
  /* ---------------- ambient atmosphere (visual only, no app logic) ---------------- */
  const pContainer = document.getElementById('particles');
  const N = 26;
  for(let i=0;i<N;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const left = Math.random()*100;
    const dur = 11 + Math.random()*15;
    const delay = Math.random()*14;
    const size = 1.5 + Math.random()*2.5;
    p.style.left = left+'vw';
    p.style.bottom = '-10px';
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = delay+'s';
    if(Math.random() > 0.7){ p.style.background = '#00E5FF'; p.style.boxShadow = '0 0 8px 2px rgba(0,229,255,0.35)'; }
    pContainer.appendChild(p);
  }

  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let w, h, cols, drops;
  function resizeMatrix(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w/18);
    drops = new Array(cols).fill(0).map(()=> Math.random()*-50);
  }
  resizeMatrix();
  window.addEventListener('resize', resizeMatrix);
  const mchars = '01アイウエオカキクケコ01001101';
  function drawMatrix(){
    ctx.fillStyle = 'rgba(5,5,5,0.08)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#00FF66';
    ctx.font = '14px monospace';
    for(let i=0;i<cols;i++){
      const text = mchars[Math.floor(Math.random()*mchars.length)];
      ctx.fillText(text, i*18, drops[i]*18);
      if(drops[i]*18 > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(drawMatrix);
  }
  drawMatrix();
</script>
